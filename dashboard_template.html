<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero Complaint System · ABT-CPD · Team Aivora</title>
<style>
:root{--bg:#faf9f6;--card:#fff;--ink:#14130f;--ink2:#55534d;--muted:#8a877e;--line:#e8e5de;--blue:#2a78d6;--blue-d:#12417f;--red:#e34948;--amber:#eda100;--green:#1baf7a;--orange:#eb6834;--violet:#6250d6;--shadow:0 1px 2px rgba(20,19,15,.05),0 6px 18px rgba(20,19,15,.05)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(120deg,#12417f,#2a78d6);color:#fff;padding:18px 24px}
header .in{max-width:1280px;margin:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}header p{margin:2px 0 0;opacity:.85;font-size:13px}
.pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:99px;font-size:12px}
nav{position:sticky;top:0;z-index:20;background:rgba(250,249,246,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .in{max-width:1280px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:8px 16px}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav button:hover{background:#efede7}nav button[aria-selected=true]{background:var(--ink);color:#fff}
nav button.quest[aria-selected=false]{color:#b45309;background:#fff4e0}
main{max-width:1280px;margin:auto;padding:20px 16px 60px}
.panel{display:none}.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
select,input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:110px}
.filters .count{margin-left:auto;font-weight:700}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g32{grid-template-columns:3fr 2fr}
@media(max-width:900px){.g2,.g3,.g5,.g32{grid-template-columns:1fr 1fr}}@media(max-width:600px){.g2,.g3,.g5,.g32{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:15px}.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
h2{font-size:18px;margin:22px 0 8px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:28px;font-weight:750;letter-spacing:-.5px}.kpi .d{font-size:12px;font-weight:600}
.good{color:#0a7a52}.bad{color:var(--red)}
.alert{border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alert.red{background:#fdecec;border:1px solid #f6c3c2}.alert.amber{background:#fff6e0;border:1px solid #f2d99a}
.alert b{font-weight:700}.btn{border:0;border-radius:99px;padding:8px 16px;font:inherit;font-weight:650;cursor:pointer;background:var(--ink);color:#fff}
.btn:hover{filter:brightness(1.15)}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid #f1efe9;vertical-align:middle}table.t tr:hover td{background:#faf8f3}
.bar{height:8px;border-radius:4px;background:#ece9e1;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.tag.High{background:#fdecec;color:#b42323}.tag.Medium{background:#fff2d1;color:#8a5a00}.tag.Low{background:#e5f1fc;color:#1d5ca8}
.tag.Proven{background:#e5f1fc;color:#1d5ca8}.tag.Moderate{background:#eeece6;color:#55534d}.tag.Weak{background:#fdecec;color:#b42323}
.heatwrap{overflow-x:auto}table.heat{border-collapse:separate;border-spacing:2px;font-size:12px;width:100%}
table.heat th{font-weight:600;color:var(--ink2);padding:2px 4px;text-align:center;font-size:11.5px;vertical-align:bottom}
table.heat th.r{text-align:right;white-space:nowrap;padding-right:8px}
table.heat td{height:34px;min-width:52px;text-align:center;border-radius:6px;cursor:default;font-weight:600;transition:transform .12s}
table.heat td.cl{cursor:pointer}table.heat td.cl:hover{transform:scale(1.08);outline:2px solid var(--ink)}table.heat td.sel{outline:2px solid var(--ink)}
.chartbox{position:relative;height:300px}.chartbox.tall{height:420px}
.cb{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.cb .n{width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb .bar{flex:1}.cb .p{width:44px;text-align:right;color:var(--ink2)}
.note{font-size:12.5px;color:var(--muted)}details summary{cursor:pointer;font-weight:600}
.steps{margin:6px 0 0;padding-left:20px;color:var(--ink2);font-size:13px}.steps li{margin:2px 0}
.ew{border-left:4px solid var(--red);background:#fff;border-radius:10px;padding:10px 14px;margin:8px 0;box-shadow:var(--shadow)}
/* ---------- QUEST ---------- */
.questbg{background:linear-gradient(160deg,#fff7e6 0%,#ffeede 45%,#eaf3ff 100%);border:1px solid #f4dcb4;border-radius:22px;padding:20px}
.qgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}@media(max-width:900px){.qgrid{grid-template-columns:1fr}}
.qcard{background:#fff;border-radius:22px;padding:26px 26px 22px;box-shadow:0 10px 30px rgba(120,80,20,.14);text-align:center;transition:transform .35s ease,opacity .35s ease;position:relative}
.qcard.leave{transform:translateX(70px) rotate(4deg) scale(.96);opacity:0}.qcard.enter{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.qemoji{font-size:64px;line-height:1;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.qcard h3{font-size:24px;margin:8px 0 2px;letter-spacing:-.3px}.qmeta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:#f4f1ea;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--ink2)}.chip.r{background:#fdecec;color:#b42323}
.qwhy{color:var(--ink2);margin:6px auto;max-width:520px}.qplay{background:#f7f5ef;border-radius:14px;padding:10px 14px;margin:10px auto;max-width:540px;text-align:left;font-size:14px}
.qq{font-size:20px;font-weight:700;margin:14px 0 12px;letter-spacing:-.2px}
.ans{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ans button{border:2px solid transparent;border-radius:16px;padding:12px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,box-shadow .12s;min-width:150px}
.ans button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 18px rgba(0,0,0,.12)}.ans button:active{transform:scale(.97)}
.ans .y{background:#d9f5e8;color:#0a6a46;border-color:#9fe0c3}.ans .w{background:#e5f1fc;color:#17508f;border-color:#a8cdf3}.ans .n{background:#fff0dc;color:#8a4b00;border-color:#f3cf9c}
.ans small{display:block;font-weight:500;font-size:11.5px;opacity:.8}
.react button{font-size:34px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 18px;cursor:pointer;transition:transform .12s}.react button:hover{transform:scale(1.18) rotate(-5deg)}
.toast{min-height:26px;margin-top:12px;font-weight:600;color:#7a4a00}
.hero{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(20,60,120,.1)}
.lvl{display:flex;align-items:center;gap:12px}.lvl .av{font-size:44px}.lvl b{font-size:18px}
.xpbar{height:12px;background:#ece9e1;border-radius:8px;overflow:hidden;margin:8px 0 2px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#eda100,#eb6834);border-radius:8px;transition:width .6s cubic-bezier(.2,1,.3,1)}
.shield{margin-top:14px}.shield .ring{height:16px;border-radius:10px;background:#fdecec;overflow:hidden}.shield .ring i{display:block;height:100%;background:linear-gradient(90deg,#1baf7a,#2a78d6);transition:width .8s cubic-bezier(.2,1,.3,1)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.badge{background:#f7f5ef;border-radius:14px;padding:8px;text-align:center;font-size:11.5px;filter:grayscale(1);opacity:.45;transition:.4s}.badge.on{filter:none;opacity:1;background:#fff4d6;animation:pop .5s}
.badge span{display:block;font-size:26px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}@media(max-width:800px){.board{grid-template-columns:1fr 1fr}}
.col{background:rgba(255,255,255,.7);border-radius:14px;padding:10px;min-height:90px}.col h4{margin:0 0 6px;font-size:12.5px;color:var(--ink2)}
.mchip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;margin:4px 0;font:inherit;font-size:12.5px;cursor:pointer}.mchip:hover{border-color:var(--ink)}
.prog{display:flex;gap:5px;justify-content:center;margin-bottom:12px}.prog i{width:26px;height:6px;border-radius:4px;background:#e8e2d4}.prog i.d{background:var(--green)}.prog i.w{background:var(--blue)}.prog i.n{background:var(--amber)}.prog i.c{background:var(--ink)}
.float{position:fixed;font-weight:800;color:#d97706;pointer-events:none;animation:up 1.1s ease-out forwards;z-index:60;font-size:22px;text-shadow:0 2px 8px #fff}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ct{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}.ct.High{background:#dcf5ea;color:#0a6a46}.ct.Medium{background:#fff2d1;color:#8a5a00}.ct.Low{background:#fdecec;color:#b42323}
.trustbox{background:#f7f9fd;border:1px solid #dbe6f5;border-radius:14px;padding:12px 14px}.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}.mini div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.mini b{display:block;font-size:20px}.mini span{font-size:11.5px;color:var(--muted)}
input[type=range]{width:100%}textarea{font:inherit;width:100%;min-height:84px;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical}
.meter{height:14px;border-radius:8px;background:#ece9e1;overflow:hidden}.meter i{display:block;height:100%;border-radius:8px}.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
footer{max-width:1280px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><div class="in"><div><h1>🎯 Zero Customer Complaint · Analytics, Prediction &amp; Prevention</h1><p>ABT-CPD · Team Aivora · Sakthi Hackathon 2.0 · Round 2</p></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill" id="asof"></span><span class="pill">Prototype · synthetic data</span></div></div></header>
<nav><div class="in" role="tablist" id="tabs"></div></nav>
<main>
<div id="filters" class="filters"></div>
<section class="panel" id="p-overview"></section>
<section class="panel" id="p-pareto"></section>
<section class="panel" id="p-trends"></section>
<section class="panel" id="p-chronic"></section>
<section class="panel" id="p-rel"></section>
<section class="panel" id="p-risk"></section>
<section class="panel" id="p-advisor"></section>
<section class="panel" id="p-trust"></section>
<section class="panel" id="p-live"></section>
<section class="panel" id="p-quest"></section>
</main>
<footer id="foot"></footer>
<canvas id="conf"></canvas>
<script>/*__CHARTJS__*/</script>
<script>
"use strict";
const D = /*__DATA__*/null;
const LIVE = !!(D && D.live);
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const CATCOL = {"Infestation":"#2a78d6","Packaging Issue":"#eb6834","Contamination / Foreign Matter":"#1baf7a","Product Quality Deviation":"#eda100","Physical Defect":"#e87ba4","Sensory Characteristics":"#008300","Weight / Quantity":"#6250d6","Process-Related Defect":"#e34948","Other":"#9aa0a6"};
const SHORT = {"Contamination / Foreign Matter":"Foreign matter","Product Quality Deviation":"Quality dev.","Process-Related Defect":"Process defect","Sensory Characteristics":"Sensory","Weight / Quantity":"Weight","Packaging Issue":"Packaging","Physical Defect":"Physical"};
const sh = c => SHORT[c] || c;
const BLUE = "#2a78d6", RED = "#e34948", GREY = "#9aa0a6", AMBER = "#eda100";
const R = D.rec.map(r => ({y:r[0], m:r[1], mi:r[2], p:r[3], cu:r[4], ca:r[5], rc:r[6], ac:r[7], sv:r[8], ef:r[9], rp:r[10], cl:r[11]}));
const NM = Math.max(...R.map(r => r.mi)) + 1;
const S = {y0: Math.min(...R.map(r => r.y)), y1: Math.max(...R.map(r => r.y)), p: -1, cu: -1};
const YMIN = S.y0, YMAX = S.y1;
let F = R, active = "overview";
const riskMap = {}; D.risk.forEach(r => { (riskMap[r.p] = riskMap[r.p] || {})[r.c] = r; });
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bandTag = b => `<span class="tag ${b}">${b}</span>`;
function applyFilter() { F = R.filter(r => r.y >= S.y0 && r.y <= S.y1 && (S.p < 0 || r.p === S.p) && (S.cu < 0 || r.cu === S.cu)); }
const count = (arr, f) => { const m = new Map(); arr.forEach(r => { const k = f(r); if (k == null || k < 0) return; m.set(k, (m.get(k) || 0) + 1); }); return m; };

Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'; Chart.defaults.font.size = 12; Chart.defaults.color = "#55534d";
Chart.defaults.animation.duration = 450; Chart.defaults.maintainAspectRatio = false; Chart.defaults.plugins.legend.labels.usePointStyle = true;
const charts = {};
function mk(id, cfg) { if (charts[id]) charts[id].destroy(); charts[id] = new Chart(document.getElementById(id), cfg); }
const grid = {color: "#eeebe4"};

function heat(rows, cols, M, o = {}) {
  const max = Math.max(...M.flat(), o.max || 1e-9), f = o.fmt || (v => v);
  let h = `<div class="heatwrap"><table class="heat"><thead><tr><th></th>${cols.map(c => `<th title="${esc(c)}">${esc(o.colShort ? o.colShort(c) : c)}</th>`).join("")}</tr></thead><tbody>`;
  rows.forEach((r, i) => {
    h += `<tr><th class="r">${esc(r)}</th>`;
    cols.forEach((c, j) => {
      const v = M[i][j], t = Math.min(v / max, 1), rr = Math.round(238 - t * (238 - 18)), gg = Math.round(244 - t * (244 - 65)), bb = Math.round(252 - t * (252 - 127));
      h += `<td class="${o.click ? "cl" : ""}" data-i="${i}" data-j="${j}" style="background:rgb(${rr},${gg},${bb});color:${t > .5 ? "#fff" : "#14130f"}" title="${esc(r)} · ${esc(c)}: ${f(v)}">${v ? f(v) : ""}</td>`;
    });
    h += "</tr>";
  });
  return h + "</tbody></table></div>";
}
function bars(items, color = BLUE, fmt = v => v) { // [{n, v, max?}]
  const mx = Math.max(...items.map(i => i.v), 1e-9);
  return items.map(i => `<div class="cb"><div class="n" title="${esc(i.n)}">${esc(i.n)}</div><div class="bar"><i style="width:${i.v / mx * 100}%;background:${i.c || color}"></i></div><div class="p">${fmt(i.v)}</div></div>`).join("");
}

/* ---------------- tabs & filters ---------------- */
const TABS = [["overview","Overview & KPIs"],["pareto","Pareto & Themes"],["trends","Trends"],["chronic","Chronic & Actions"],["rel","Relationships"],["risk","Risk & Early Warning"],["advisor","Preventive Advisor"],["trust","Model Trust"],["live","🤖 Live AI"],["quest","🎮 Prevention Quest"]];
const FILTERED = new Set(["overview","pareto","trends","rel"]);
$("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" data-k="${k}" class="${k === "quest" ? "quest" : ""}" aria-selected="false">${l}</button>`).join("");
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.k); });
function go(k) {
  active = k; try { sessionStorage.setItem('zcc_tab', k); } catch (e) {} $$("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
  $$(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + k)); $("#filters").style.display = FILTERED.has(k) ? "flex" : "none";
  render(); window.scrollTo({top: 0});
}
function buildFilters() {
  const yrs = Array.from({length: YMAX - YMIN + 1}, (_, i) => YMIN + i);
  $("#filters").innerHTML = `<label>From year<select id="fy0">${yrs.map(y => `<option ${y === S.y0 ? "selected" : ""}>${y}</option>`).join("")}</select></label>
  <label>To year<select id="fy1">${yrs.map(y => `<option ${y === S.y1 ? "selected" : ""}>${y}</option>`).join("")}</select></label>
  <label>Product<select id="fp"><option value="-1">All products</option>${D.prods.map((p, i) => `<option value="${i}">${p}</option>`).join("")}</select></label>
  <label>Customer<select id="fc"><option value="-1">All customers</option>${D.custs.map((p, i) => `<option value="${i}">${p}</option>`).join("")}</select></label>
  <button class="btn alt" id="freset">Reset</button><div class="count"><span id="fcount"></span> complaints in view</div>`;
  const upd = () => { S.y0 = +$("#fy0").value; S.y1 = +$("#fy1").value; if (S.y0 > S.y1) { S.y1 = S.y0; $("#fy1").value = S.y1; } S.p = +$("#fp").value; S.cu = +$("#fc").value; render(); };
  $$("#filters select").forEach(s => s.addEventListener("change", upd));
  $("#freset").onclick = () => { S.y0 = YMIN; S.y1 = YMAX; S.p = S.cu = -1; buildFilters(); render(); };
}
function render() { applyFilter(); $("#fcount") && ($("#fcount").textContent = F.length.toLocaleString()); ({overview, pareto, trends, chronic, rel, risk, advisor, trust, live, quest})[active](); }

/* ---------------- 1 overview ---------------- */
function overview() {
  const k = D.kpi, hi = D.risk.filter(r => r.band === "High").sort((a, b) => b.prob - a.prob);
  const d = (a, b, inv = true, f = v => v.toFixed(0)) => { const x = a - b; return `<span class="d ${(x <= 0) === inv ? "good" : "bad"}">${x > 0 ? "▲" : x < 0 ? "▼" : "•"} ${f(Math.abs(x))} vs prior 12 m</span>`; };
  let h = "";
  if (hi.length) h += `<div class="alert red"><span style="font-size:22px">🚨</span><div><b>${hi.length} high-risk combinations predicted for ${D.forecast}:</b> ${hi.slice(0, 3).map(r => `${D.prods[r.p]} → ${sh(D.cats[r.c])} (${pct(r.prob)})`).join("; ")}.${D.ew.length ? ` ${D.ew.length} early-warning alert${D.ew.length > 1 ? "s" : ""} active.` : ""}</div><div style="margin-left:auto;display:flex;gap:8px"><button class="btn alt" onclick="go('risk')">See risks</button><button class="btn" onclick="go('quest')">🎮 Start the Prevention Quest</button></div></div>`;
  h += `<div class="grid g5">
   <div class="card kpi"><div class="l">Complaints, last 12 months</div><div class="v">${k.complaints_12m}</div>${d(k.complaints_12m, k.complaints_prev)}</div>
   <div class="card kpi"><div class="l">Complaints per 100 t shipped</div><div class="v">${k.rate_12m.toFixed(2)}</div>${d(k.rate_12m, k.rate_prev, true, v => v.toFixed(2))}</div>
   <div class="card kpi"><div class="l">Critical complaints</div><div class="v">${k.critical_12m}</div>${d(k.critical_12m, k.critical_prev)}</div>
   <div class="card kpi"><div class="l">Repeat complaints</div><div class="v">${k.repeat_pct.toFixed(0)}%</div>${d(k.repeat_pct, k.repeat_prev, true, v => v.toFixed(1) + " pts")}</div>
   <div class="card kpi"><div class="l">Corrective actions effective</div><div class="v">${k.effective_pct.toFixed(0)}%</div><span class="d" style="color:var(--muted)">target &gt; 90%</span></div></div>
  <div class="grid g32" style="margin-top:14px"><div class="card"><h3>Complaints per 100 tonnes: actual vs. glide-path to zero</h3><p class="sub">Full calendar years. Dashed line = target of −30% each year.</p><div class="chartbox"><canvas id="c-annual"></canvas></div></div>

/* ---------------- 5 relationships ---------------- */
let relSel = null;
function lift(rowFn, colFn, rows, cols, minN) {
  const m = new Map(), rt = new Map(), ct = new Map(); let tot = 0;
  F.forEach(r => { const a = rowFn(r), b = colFn(r); if (a < 0 || b < 0) return; const k = a + "|" + b; m.set(k, (m.get(k) || 0) + 1); rt.set(a, (rt.get(a) || 0) + 1); ct.set(b, (ct.get(b) || 0) + 1); tot++; });
  return [...m.entries()].map(([k, n]) => { const [a, b] = k.split("|").map(Number); return {row: rows[a], col: cols[b], n, share: n / rt.get(a) * 100, lift: n / rt.get(a) / (ct.get(b) / tot)}; }).filter(x => x.n >= minN).sort((a, b) => b.lift - a.lift).slice(0, 8);
}

  <h2>Who sees what? (lift &gt; 1 = more than average)</h2><div class="grid g2"><div class="card"><h3>Customer → complaint type</h3><div id="l1"></div></div><div class="card"><h3>Product → root cause</h3><div id="l2"></div></div></div>`;
  const ca = D.cats, M1 = D.prods.map(() => ca.map(() => 0)), M2 = D.custs.map(() => ca.map(() => 0)); F.forEach(r => { M1[r.p][r.ca]++; M2[r.cu][r.ca]++; });
  $("#h1").innerHTML = heat(D.prods, ca, M1, {click: 1, colShort: sh}); $("#h2").innerHTML = heat(D.custs, ca, M2, {colShort: sh});
  $("#h1").onclick = e => { const td = e.target.closest("td.cl"); if (td) { relSel = [+td.dataset.i, +td.dataset.j]; drill(); } };
  const top = [...count(F, r => r.rc).entries()].sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]); const M3 = D.prods.map(() => top.map(() => 0)); F.forEach(r => { const j = top.indexOf(r.rc); if (j >= 0) M3[r.p][j]++; });
  $("#h3").innerHTML = heat(D.prods, top.map(i => D.rcs[i]), M3, {colShort: s => s.length > 16 ? s.slice(0, 15) + "…" : s});
  const bi = D.b_inf, bp = D.b_pack, bc = (id, d, col, xl) => mk(id, {type: "bar", data: {labels: d.map(x => x.band), datasets: [{label: "complaints / 100 t", data: d.map(x => x.per_100t), backgroundColor: col, borderRadius: 5}]}, options: {scales: {y: {beginAtZero: true, grid, title: {display: true, text: "complaints / 100 t"}}, x: {grid: {display: false}, title: {display: true, text: xl}}}, plugins: {legend: {display: false}, tooltip: {callbacks: {afterLabel: c => `${d[c.dataIndex].complaints} complaints · ${d[c.dataIndex].months} product-months`}}}}});
  bc("c-bi", bi, BLUE, "average moisture band (%)"); bc("c-bp", bp, "#eb6834", "average sealing temperature band (°C)");
  $("#bi").textContent = `Wettest band has ${(bi[bi.length - 1].per_100t / bi[0].per_100t).toFixed(1)}× the infestation rate of the driest.`; $("#bp").textContent = `Coolest-seal band has ${(bp[0].per_100t / bp[bp.length - 1].per_100t).toFixed(1)}× the packaging rate of the hottest.`;
  const mn = F.length < 2000 ? 8 : 20, lt = (L, a, b) => `<table class="t"><thead><tr><th>${a}</th><th>${b}</th><th>Share</th><th>Lift</th><th>n</th></tr></thead><tbody>${L.map(x => `<tr><td>${esc(x.row)}</td><td>${esc(sh(x.col))}</td><td>${x.share.toFixed(1)}%</td><td><b>${x.lift.toFixed(2)}×</b></td><td>${x.n}</td></tr>`).join("")}</tbody></table>`;

function drill() {

}
function actStats(rc) { const m = new Map(); R.forEach(r => { if (r.rc !== rc || r.ac < 0 || r.ef < 0) return; const a = m.get(r.ac) || {n: 0, e: 0}; a.n++; a.e += r.ef; m.set(r.ac, a); }); return [...m.entries()].filter(([, a]) => a.n >= 8).map(([k, a]) => ({ac: k, n: a.n, eff: a.e / a.n * 100})).sort((a, b) => b.eff - a.eff); }
function fixList(rcList) { return rcList.map(rc => `<div style="margin:6px 0"><span class="note">${esc(D.rcs[rc])}</span>${actStats(rc).slice(0, 2).map(a => `<div>${D.fun[D.acts[a.ac]] ? D.fun[D.acts[a.ac]].e : ""} ${esc(D.acts[a.ac])} <span class="tag ${a.eff >= 75 ? "Proven" : a.eff >= 45 ? "Moderate" : "Weak"}">${a.eff.toFixed(0)}%</span></div>`).join("")}</div>`).join(""); }

function quest() {

function toast2(t) { const e = $("#toast"); if (e) e.textContent = t; }

function dl() {

  D.missions.forEach(m => { const a = Q.a[m.id] || {}; rows.push([m.name, m.product, m.category, m.action, ({done: "Implemented", wip: "In progress", not: "Not yet"})[a.s] || "Unanswered", a.r || "", a.t || ""]); });

function confetti(n) {

  const cv = $("#conf"), cx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight; const cols = ["#eda100", "#eb6834", "#2a78d6", "#1baf7a", "#e87ba4", "#6250d6"];
